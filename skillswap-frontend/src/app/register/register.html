<div class="register-page">

  <div class="register-container">

    <!-- Header -->
    <div class="register-header">

      <div class="logo">
        Skill<span>Swap</span>
      </div>

      <p>
        Already have an account?
        <a routerLink="/login">Login</a>
      </p>

    </div>


    <!-- Progress -->
    <div class="progress">

      <div class="progress-step active">
        <span>1</span>
        <p>Personal</p>
      </div>

      <div class="progress-line"></div>

      <div class="progress-step">
        <span>2</span>
        <p>Education</p>
      </div>

      <div class="progress-line"></div>

      <div class="progress-step">
        <span>3</span>
        <p>Skills</p>
      </div>

    </div>


    <!-- Form -->
    <div class="form-container">

      <div class="form-title">

        <p class="tagline">
          STEP 01
        </p>

        <h1>Create Your Profile</h1>

        <p>
          Tell us a little about yourself.
        </p>

      </div>


      <form (ngSubmit)="continueToEducation()">

        <!-- Name -->
        <div class="form-group">

          <label for="name">
            Full Name
          </label>

          <input
            type="text"
            id="name"
            name="name"
            [(ngModel)]="user.name"
            placeholder="Enter your full name"
            required
          >

        </div>


        <!-- Email -->
        <div class="form-group">

          <label for="email">
            Email Address
          </label>

          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="user.email"
            placeholder="Enter your email"
            required
          >

        </div>


        <!-- Password -->
        <div class="form-group">

          <label for="password">
            Password
          </label>

          <input
            type="password"
            id="password"
            name="password"
            [(ngModel)]="user.password"
            placeholder="Create a password"
            minlength="6"
            required
          >

        </div>


        <!-- Phone -->
        <div class="form-group">

          <label for="phone">
            Phone Number
          </label>

          <input
            type="tel"
            id="phone"
            name="phone"
            [(ngModel)]="user.phone"
            placeholder="Enter your phone number"
            required
          >

        </div>


        <!-- Location -->
        <div class="form-group">

          <label for="location">
            Location
          </label>

          <input
            type="text"
            id="location"
            name="location"
            [(ngModel)]="user.location"
            placeholder="City, State"
          >

        </div>


        <!-- Bio -->
        <div class="form-group">

          <label for="bio">
            Short Introduction
          </label>

          <textarea
            id="bio"
            name="bio"
            [(ngModel)]="user.bio"
            rows="4"
            placeholder="Tell other SkillSwap users about yourself..."
          ></textarea>

        </div>


        <!-- Continue -->
        <button
          type="submit"
          class="continue-btn">
          Continue to Education →
        </button>

      </form>

    </div>

  </div>

</div>
