<div class="login-page">

  <div class="login-container">

    <!-- LEFT SIDE -->

    <div class="login-info">

      <div class="logo">
        Skill<span>Swap</span>
      </div>

      <div class="info-content">

        <p class="tagline">
          LEARN • TEACH • CONNECT
        </p>

        <h1>
          Welcome back to<br>
          <span>SkillSwap.</span>
        </h1>

        <p>
          Continue your skill journey, connect with
          your matches and keep growing.
        </p>

      </div>

    </div>


    <!-- RIGHT SIDE -->

    <div class="login-form-container">

      <div class="login-form">

        <h2>Welcome Back</h2>

        <p class="subtitle">
          Login to your SkillSwap account
        </p>


        <form>

          <!-- EMAIL -->

          <div class="form-group">

            <label for="email">
              Email Address
            </label>

            <input
              type="email"
              id="email"
              placeholder="Enter your email"
              required
            >

          </div>


          <!-- PASSWORD -->

          <div class="form-group">

            <div class="password-label">

              <label for="password">
                Password
              </label>

              <a href="#">
                Forgot Password?
              </a>

            </div>

            <input
              type="password"
              id="password"
              placeholder="Enter your password"
              required
            >

          </div>


          <!-- REMEMBER ME -->

          <div class="remember">

            <label>
              <input type="checkbox">
              Remember me
            </label>

          </div>


          <!-- LOGIN -->

          <button
            type="submit"
            class="login-button">

            Login →

          </button>

        </form>


        <div class="divider">
          <span>OR</span>
        </div>


        <p class="register-text">

          Don't have an account?

          <a routerLink="/register">
  Create Account
</a>
        </p>

      </div>

    </div>

  </div>

</div>
