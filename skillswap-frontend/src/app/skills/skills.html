<div class="skills-page">

  <div class="skills-container">

    <div class="skills-header">
      <div class="logo">
        Skill<span>Swap</span>
      </div>

      <p>STEP 03</p>
    </div>


    <div class="form-container">

      <h1>Your Skills</h1>

      <p>
        Tell us what you can teach and what you want to learn.
      </p>


      <!-- TEACH SKILLS -->

      <div class="form-group">

        <label for="teach">
          Skills You Can Teach
        </label>

        <div class="skill-input">

          <input
            type="text"
            id="teach"
            [(ngModel)]="teachInput"
            (keyup.enter)="addTeachSkill()"
            placeholder="e.g. Java, Python, Photoshop"
          >

          <button
            type="button"
            (click)="addTeachSkill()">
            Add
          </button>

        </div>


        <div class="skill-list">

          <span
            class="skill-tag"
            *ngFor="let skill of teachSkills; let i = index">

            {{ skill }}

            <button
              type="button"
              (click)="removeTeachSkill(i)">
              ×
            </button>

          </span>

        </div>

      </div>


      <!-- LEARN SKILLS -->

      <div class="form-group">

        <label for="learn">
          Skills You Want To Learn
        </label>

        <div class="skill-input">

          <input
            type="text"
            id="learn"
            [(ngModel)]="learnInput"
            (keyup.enter)="addLearnSkill()"
            placeholder="e.g. Web Development, UI/UX"
          >

          <button
            type="button"
            (click)="addLearnSkill()">
            Add
          </button>

        </div>


        <div class="skill-list">

          <span
            class="skill-tag"
            *ngFor="let skill of learnSkills; let i = index">

            {{ skill }}

            <button
              type="button"
              (click)="removeLearnSkill(i)">
              ×
            </button>

          </span>

        </div>

      </div>


      <!-- COMPLETE PROFILE -->

      <button
        type="button"
        class="continue-btn"
        (click)="saveSkills()">

        Complete Profile →

      </button>


    </div>

  </div>

</div>
