<div class="skills-page">

  <div class="skills-container">

    <div class="skills-header">

      <div class="logo">
        Skill<span>Swap</span>
      </div>

      <p>STEP 03</p>

    </div>

    <div class="form-container">

      <h1>Your Skills</h1>

      <p>
        Tell us what you can teach and what you want to learn.
      </p>

      <div class="form-group">

        <label for="teach">
          Skills You Can Teach
        </label>

        <input
          type="text"
          id="teach"
          placeholder="e.g. Java, Python, Photoshop">

      </div>

      <div class="form-group">

        <label for="learn">
          Skills You Want To Learn
        </label>

        <input
          type="text"
          id="learn"
          placeholder="e.g. Web Development, UI/UX">

      </div>

      <button
        type="button"
        class="continue-btn"
        routerLink="/dashboard">
        Complete Profile →
      </button>

    </div>

  </div>

</div>
